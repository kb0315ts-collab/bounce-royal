<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141b33">
  <meta name="description" content="바운스로얄 솔로 로그라이크에 나오는 몬스터의 생김새와 공격 모션을 실제 코드 그대로 돌려 봅니다.">
  <title>몬스터 전시관 · 바운스로얄</title>
  <link rel="stylesheet" href="css/casual-fonts.css">
  <link rel="stylesheet" href="css/casual-library.css">
  <link rel="stylesheet" href="css/cosmic-library.css">
  <link rel="stylesheet" href="css/monster-hall.css">
  <script src="vendor/phaser.min.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/audio-design.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/sim.js" defer></script>
  <script src="js/rogue-data.js" defer></script>
  <script src="js/rogue-sim.js" defer></script>
  <script src="js/render.js" defer></script>
  <script src="js/rogue-render.js" defer></script>
  <script src="js/icons.js" defer></script>
  <script src="js/monster-hall.js" defer></script>
</head>
<body>
  <div class="hall-shell">
    <header class="hall-header">
      <a class="brand" href="index.html" aria-label="바운스로얄 게임으로 돌아가기">
        <span class="brand-emblem" data-ui-icon="brand"></span>
        <span>BOUNCE <strong>ROYALE</strong></span>
      </a>
      <h1>몬스터 전시관</h1>
      <a class="back-link" href="index.html"><span data-ui-icon="back"></span>게임으로</a>
    </header>

    <main class="hall">
      <nav class="hall-list" id="hall-list" aria-label="몬스터 목록"></nav>

      <section class="hall-stage">
        <div class="stage-frame">
          <div id="app"><canvas id="game"></canvas></div>
          <div class="stage-tag" id="stage-state">대기</div>
        </div>
        <div class="stage-bar">
          <button class="hall-btn primary" id="btn-play" type="button">일시정지</button>
          <button class="hall-btn" id="btn-reset" type="button">다시 세우기</button>
          <label class="hall-toggle"><input type="checkbox" id="chk-slow"> 느리게</label>
          <label class="hall-toggle"><input type="checkbox" id="chk-hold"> 인형 고정</label>
          <label class="hall-toggle"><input type="checkbox" id="chk-sound"> 소리</label>
        </div>
        <div class="stage-patterns hidden" id="stage-patterns">
          <span class="patterns-label">패턴 보기</span>
          <div class="patterns-row" id="patterns-row"></div>
          <label class="hall-toggle"><input type="checkbox" id="chk-phase2"> 2페이즈</label>
        </div>
      </section>

      <aside class="hall-info">
        <div class="info-head">
          <canvas class="info-face" id="info-face" aria-hidden="true"></canvas>
          <div>
            <span class="info-kind" id="info-kind">고블린볼</span>
            <h2 id="info-name">몽둥이 고블린볼</h2>
          </div>
        </div>
        <p class="info-desc" id="info-desc"></p>
        <h3 class="info-sub">공격 방식</h3>
        <ul class="info-motion" id="info-motion"></ul>
        <h3 class="info-sub">수치 <small>(웨이브 배율 적용 전)</small></h3>
        <dl class="info-stats" id="info-stats"></dl>
      </aside>
    </main>

    <p class="hall-foot">여기 보이는 움직임은 실제 게임과 같은 두뇌(<code>js/rogue-sim.js</code>)와 같은 그림(<code>js/rogue-render.js</code>)입니다.
      연습 상대 인형은 피해를 주지 않고, 쓰러져도 바로 일어납니다.</p>
  </div>
</body>
</html>
