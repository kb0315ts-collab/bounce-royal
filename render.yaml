# Render 배포 설정 — 저장소를 연결하면 이 파일을 읽어 자동 구성한다.
# 서버가 게임 파일까지 함께 서빙하므로 이 서비스 하나면 멀티플레이가 동작한다.
#
# 주의: rootDir는 쓰지 않는다. rootDir를 지정하면 Render가 그 폴더의 변경만
# 감시해서, server/ 밖에 있는 클라이언트 파일(js/·index.html)만 고친 커밋이
# 재배포되지 않는다. 저장소 루트를 기준으로 명령을 실행한다.
services:
  - type: web
    name: bounce-royal
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: SEARCH_SECONDS
        value: "20"
      - key: FILL_WITH_AI
        value: "1"
